group 'com.spencerccf.app_settings'
version '1.0-SNAPSHOT'

buildscript {
    ext {
        kotlin_version = '2.2.10'
        gradle_version = '8.13.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ compiles Kotlin with its built-in support and fails the build if the
// Kotlin Gradle Plugin (kotlin-android) is applied as well. Only apply KGP when
// the consuming app has not enabled built-in Kotlin (AGP < 9, or
// android.builtInKotlin=false). Same approach as app_badge_plus / firebase_*.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdkVersion 36

    namespace 'com.spencerccf.app_settings'
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }
}

// `android.kotlinOptions` no longer exists with AGP 9 built-in Kotlin; the
// top-level `kotlin {}` extension works both with KGP (2.0+) and built-in Kotlin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
